<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 350" width="490" height="350">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap");
      .terminal { font-family: "Fira Code", monospace; font-size: 13px; }
      .prompt { font-weight: 600; fill: #58a6ff; }
      .host { font-weight: 600; fill: #39d353; }
      .key { font-weight: 600; fill: #ff7b72; }
      .val { fill: #c9d1d9; }
      .separator { fill: #8b949e; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" rx="6" />
  <text x="25" y="35" class="terminal" opacity="0">
    <tspan class="prompt">andrew</tspan>
    <tspan class="separator">@</tspan>
    <tspan class="host">github</tspan>
    <tspan class="val"> ~ $ neofetch</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.1s" fill="freeze" />
  </text>
  <text x="25" y="51" class="terminal" fill="#8b949e" opacity="0">
    -------------
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.25s" fill="freeze" />
  </text>
  <text x="25" y="75" class="terminal" opacity="0">
    <tspan class="key">OS</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Windows, WSL2 Linux, MacOS</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.35s" fill="freeze" />
    <animate attributeName="y" from="80" to="75" dur="0.2s" begin="0.35s" fill="freeze" />
  </text>
  <text x="25" y="99" class="terminal" opacity="0">
    <tspan class="key">Uptime</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Senior Year (Expected Grad: Dec 2026)</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.43s" fill="freeze" />
    <animate attributeName="y" from="104" to="99" dur="0.2s" begin="0.43s" fill="freeze" />
  </text>
  <text x="25" y="123" class="terminal" opacity="0">
    <tspan class="key">Shell</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">bash / zsh / Git Bash / CMD</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.51s" fill="freeze" />
    <animate attributeName="y" from="128" to="123" dur="0.2s" begin="0.51s" fill="freeze" />
  </text>
  <text x="25" y="147" class="terminal" opacity="0">
    <tspan class="key">Major</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Computer Science (Math Minor)</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.59s" fill="freeze" />
    <animate attributeName="y" from="152" to="147" dur="0.2s" begin="0.59s" fill="freeze" />
  </text>
  <text x="25" y="171" class="terminal" opacity="0">
    <tspan class="key">Stack</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Python, JS, Node.js, Express, SQL, C++</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.67s" fill="freeze" />
    <animate attributeName="y" from="176" to="171" dur="0.2s" begin="0.67s" fill="freeze" />
  </text>
  <text x="25" y="195" class="terminal" opacity="0">
    <tspan class="key">Current</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Backend Lead &amp; Solutions Eng Co-Op</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.75s" fill="freeze" />
    <animate attributeName="y" from="200" to="195" dur="0.2s" begin="0.75s" fill="freeze" />
  </text>
  <text x="25" y="219" class="terminal" opacity="0">
    <tspan class="key">Focus</tspan>
    <tspan class="separator">: </tspan>
    <tspan class="val">Full Stack, AI Tooling, Data Science</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.83s" fill="freeze" />
    <animate attributeName="y" from="224" to="219" dur="0.2s" begin="0.83s" fill="freeze" />
  </text>
</svg>